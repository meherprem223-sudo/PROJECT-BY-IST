services:
  - type: web
    name: project-by-ist
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: sh -c 'exec gunicorn app:app --bind 0.0.0.0:${PORT:-10000}'
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://project-by-ist.onrender.com,https://project-by-ist-4a5q-git-main-mukund24.vercel.app
